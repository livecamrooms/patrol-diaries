<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Patrol Diaries – Affiliate Network</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="container">
      <h1>Patrol Diaries</h1>
      <p class="tagline">Asian Sex Diary · Trike Patrol · TukTuk Patrol · network hub</p>
      <nav class="nav">
        <a href="index.html" class="active">Sites</a>
        <a href="gallery.html">Galleries</a>
        <a href="content.html">Latest</a>
        <a href="links.html">Links</a>
      </nav>
    </div>
  </header>
  <main class="container">
    <div class="search-bar">
      <input id="q" type="search" placeholder="Search sites…" autocomplete="off" />
    </div>
    <div class="note">Browse network sites or open the full <a href="gallery.html" style="color:#c4b5fd">FHG gallery catalog</a>(4000+ sets).</div>
    <div class="grid" id="grid"></div>
  </main>
  <footer><div class="container">Patrol Diaries</div></footer>
  <script>
    async function run() {
      const data = await (await fetch('data.json')).json();
      const grid = document.getElementById('grid');
      const sites = data.sites || [];
      function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
      function render(list) {
        grid.innerHTML = list.map(s => {
          const primary = (s.links && s.links[0]) || s.link;
          return `<article class="card" data-name="${esc((s.name||'')+' '+s.slug+' '+(s.region||'')).toLowerCase()}">
            <div class="body">
              <div><span class="badge">${esc(s.region||'Network')}</span></div>
              <h2>${esc(s.name)}</h2>
              <p style="color:var(--muted);font-size:0.85rem;margin:0;flex:1">${esc(s.blurb||'')}</p>
              <a class="btn" href="${primary}" target="_blank" rel="noopener sponsored">Open</a>
            </div>
          </article>`;
        }).join('');
      }
      render(sites);
      document.getElementById('q').addEventListener('input', e => {
        const q = e.target.value.trim().toLowerCase();
        render(sites.filter(s => !q || `${s.name} ${s.slug} ${s.region} ${s.blurb}`.toLowerCase().includes(q)));
      });
    }
    run();
  </script>
</body>
</html>
