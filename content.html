<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Latest – Patrol Diaries</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="container">
      <h1>Patrol Diaries</h1>
      <p class="tagline">Recent FHG picks</p>
      <nav class="nav">
        <a href="index.html">Sites</a>
        <a href="gallery.html">Galleries</a>
        <a href="content.html" class="active">Latest</a>
        <a href="links.html">Links</a>
      </nav>
    </div>
  </header>
  <main class="container">
    <div class="note">Newest galleries from the dump (first 60). Full catalog on <a href="gallery.html" style="color:#c4b5fd">Galleries</a>.</div>
    <div class="grid" id="grid"></div>
  </main>
  <footer><div class="container">Patrol Diaries</div></footer>
  <script>
    function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
    async function run(){
      const data=await(await fetch('data.json')).json();
      const items=(data.fhgs||[]).slice(0,60);
      document.getElementById('grid').innerHTML=items.map(it=>{
        const alt=esc((it.title||'')+(it.model?' – '+it.model:''));
        const img=it.thumb?`<a class="thumb-wrap" href="${it.link}" target="_blank" rel="noopener sponsored"><img src="${esc(it.thumb)}" alt="${alt}" loading="lazy" referrerpolicy="no-referrer" onerror="this.classList.add('broken');var f=this.nextElementSibling;if(f)f.hidden=false"/><div class="thumb-fallback" hidden>${esc(it.site)}</div></a>`:'';
        return `<article class="card">${img}<div class="body"><div><span class="badge">${esc(it.site)}</span></div><h2>${esc(it.title)}</h2><div class="meta">${esc(it.model||'')}</div><a class="btn" href="${it.link}" target="_blank" rel="noopener sponsored">Open gallery</a></div></article>`;
      }).join('');
    }
    run();
  </script>
</body>
</html>
